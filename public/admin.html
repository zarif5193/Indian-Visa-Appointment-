<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Indian Visa Booking System</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1> Admin Login</h1>
    <p>Indian Visa Booking System — Admin Panel</p>
    <input type="password" id="loginPw" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" onclick="login()">Login</button>
    <div id="loginErr" class="errors" style="display:none;margin-top:12px"></div>
  </div>
</div>

<div id="appView" class="admin-wrap" hidden>
  <aside class="sidebar">
    <div class="brand">🇮 IVAS<small>Admin Panel</small></div>
    <button data-view="dashboard" class="active" onclick="go('dashboard')">📊 Dashboard</button>
    <button data-view="apps" onclick="go('apps')">📁 Applications</button>
    <button data-view="receipts" onclick="go('receipts')">🧾 Receipts</button>
    <button data-view="settings" onclick="go('settings')">⚙️ Settings</button>
    <div class="spacer"></div>
    <button onclick="logout()">🚪 Logout</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="/admin.js"></script>
</body>
</html>
